<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Perdagangan Indonesia</title>
<meta name="description" content="Ekspor dan impor Indonesia 2025 dibanding 2024, global dan per negara mitra. Sumber: WITS (World Bank).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#f4f3ef;color:#0b0b0b;font:400 13px/1.35 "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.root{height:100vh;min-height:660px;min-width:1180px;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
button{font:inherit;color:inherit}
.hd{display:flex;align-items:center;gap:14px;height:32px;flex:none}
.hd h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.crumb{color:#52514e;font-size:13px}.crumb b{color:#0b0b0b;font-weight:600}
.sp{flex:1}
.src{color:#6f6e68;font-size:12px}
.seg{display:inline-flex;border:1px solid rgba(11,11,11,.18);border-radius:7px;padding:2px;background:#fcfcfb}
.sg{white-space:nowrap;border:0;background:none;padding:3px 10px;border-radius:5px;color:#52514e;font-size:12.5px;cursor:pointer}
.sg:hover{color:#0b0b0b}
.sg.on{background:#0b0b0b;color:#fff}
.back{border:1px solid rgba(11,11,11,.18);background:#fcfcfb;border-radius:6px;padding:3px 10px;font-weight:500;cursor:pointer}
.hide{display:none!important}
.pn{background:#fcfcfb;border:1px solid rgba(11,11,11,.09);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex:none}
.ph h2{margin:0;font-size:14px;font-weight:600;white-space:nowrap}
.ph i{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.sub{color:#6f6e68;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kr{display:flex;gap:10px;height:76px;flex:none}
.kp{flex:1;background:#fcfcfb;border:1px solid rgba(11,11,11,.09);border-radius:10px;padding:8px 14px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.kp .l{font-size:12.5px;color:#52514e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp .v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.kp .d{font-size:12px;color:#6f6e68;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp.dk{background:#0b0b0b;border-color:#0b0b0b;color:#fff}.kp.dk .l,.kp.dk .d{color:#c3c2b7}
.mid{display:flex;gap:10px;flex:1.7 1 0;min-height:0}
.bot{display:flex;gap:10px;flex:1 1 0;min-height:236px}
.mapPn{flex:1}
.map{position:relative;flex:1;min-height:0;border-radius:8px;overflow:hidden;background:#e4e9ef}
#wrap{position:absolute;left:0;top:0}
#plot{position:absolute;left:0;top:0}
#plot .choroplethlocation{cursor:pointer}
#ov{position:absolute;left:0;top:0;pointer-events:none}
#chips{position:absolute;left:0;top:0;pointer-events:none}
.fl{fill:none;stroke-linecap:round}
.dsh{fill:none;stroke:rgba(255,255,255,.75);stroke-width:3;stroke-linecap:round;stroke-dasharray:2 16;animation:dsh .9s linear infinite}
@keyframes dsh{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@media (prefers-reduced-motion:reduce){.dsh{animation:none}}
.ac{position:absolute;background:rgba(252,252,251,.94);padding:2px 7px;border-radius:2px;font-size:12.5px;color:#0b0b0b;white-space:nowrap}
.ac b{font-weight:700}
.ac.cb{border:1.5px solid #2a78d6}.ac.co{border:1.5px solid #eb6834}.ac.nm0{border:1.5px solid #0b0b0b}
#mini{position:absolute;left:12px;bottom:12px;width:240px;height:124px;border:2px solid #fcfcfb;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.25);overflow:hidden;background:#e4e9ef}
.cap{position:absolute;left:10px;bottom:8px;font-size:11px;color:#52514e;background:rgba(252,252,251,.92);padding:2px 6px;border-radius:4px;max-width:70%}
.cap.capr{left:auto;right:10px}
.lgd{position:absolute;right:10px;bottom:8px;display:flex;align-items:center;gap:6px;font-size:11px;color:#52514e;background:rgba(252,252,251,.92);padding:3px 8px;border-radius:4px}
.lgd i{display:block;width:90px;height:8px;border-radius:2px}
.lg{display:flex;gap:12px;font-size:11.5px;color:#52514e;justify-content:flex-end}
.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.srch{margin-left:auto;width:150px;border:1px solid rgba(11,11,11,.18);border-radius:7px;padding:3px 8px;font:inherit;font-size:12px;background:#fcfcfb}
.rankPn{width:440px;flex:none}
.hh{display:grid;grid-template-columns:1fr 92px 1fr 40px;gap:6px;font-size:11px;color:#6f6e68;border-bottom:1px solid rgba(11,11,11,.09);padding-bottom:3px;margin-top:4px;flex:none}
#rows{flex:1;min-height:0;display:grid;grid-template-rows:repeat(15,minmax(0,1fr))}
.r{width:100%;border:0;background:none;padding:0;margin:0;text-align:left;display:grid;grid-template-columns:1fr 92px 1fr 40px;gap:6px;align-items:center;font-size:12px;border-radius:5px;cursor:pointer;min-height:0}
.r:hover{background:rgba(11,11,11,.04)}
.r.on{background:#e3eefb;box-shadow:inset 3px 0 0 #0d366b}
.r.on .nm{font-weight:700}
.lf{display:flex;justify-content:flex-end;align-items:center;gap:4px;color:#52514e;font-size:11px}
.rt{display:flex;align-items:center;gap:4px;color:#52514e;font-size:11px}
.lf i,.rt i{display:block;height:12px}
.lf i{border-radius:2px 0 0 2px;background:#eb6834}.rt i{border-radius:0 2px 2px 0;background:#2a78d6}
.nm{text-align:center;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl{text-align:right;font-weight:600;font-size:11.5px}
.prod{flex:1}
.hh2,.dr{display:grid;grid-template-columns:22px minmax(110px,170px) 1fr 48px 48px 68px;gap:10px;align-items:center}
.hh2{height:20px;font-size:11px;color:#6f6e68;border-bottom:1px solid rgba(11,11,11,.1);flex:none}
.rowsP{flex:1;min-height:0;display:grid;grid-template-rows:repeat(8,minmax(0,1fr))}
.dr{font-size:13px;min-height:0}
.num{text-align:right}
.rk{color:#9a9992;text-align:right;font-weight:700;font-size:14px}
.rk.top{color:#0b0b0b}
.nm2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr2{height:12px;background:#efeee9;border-radius:3px;overflow:hidden}
.tr2 i{display:block;height:100%;border-radius:3px 0 0 3px}
.pv{text-align:right;font-weight:600}
.ps{text-align:right;color:#52514e}
.chip{justify-self:end;font-size:11.5px;font-weight:600;padding:0 7px;border-radius:9px;white-space:nowrap}
.up{background:#e3eefb;color:#164f94}.dn{background:#fde8df;color:#9a3412}.nw{background:#efeee9;color:#52514e}
.hov{font:12px "IBM Plex Sans",sans-serif}
</style>
</head>
<body>
<div class="root">
  <header class="hd">
    <button class="back hide" id="back" type="button">← Kembali ke global</button>
    <h1>Perdagangan Indonesia</h1>
    <div class="crumb"><span>Seluruh dunia</span><span id="tail" class="hide"> › <b id="tailNm"></b></span></div>
    <div class="sp"></div>
    <span class="src">2025 vs 2024 · Sumber: WITS (World Bank) · HS 2 digit · US$ miliar</span>
    <div class="seg"><button class="sg on" id="gBtn" type="button">Global</button><button class="sg" id="cBtn" type="button" disabled>Klik negara untuk detail</button></div>
  </header>

  <section class="kr" id="kpis" aria-label="Ringkasan"></section>

  <section class="mid">
    <div class="pn mapPn">
      <div class="ph"><h2>Peta mitra dagang</h2><span class="sub" id="mapSub"></span>
        <div class="seg" style="margin-left:auto" id="projSeg"><button class="sg on" data-p="eq" type="button">Peta baru (Equal Earth)</button><button class="sg" data-p="me" type="button">Peta lama (Mercator)</button></div>
        <div class="seg" id="metSeg"><button class="sg on" data-m="tot" type="button">Total</button><button class="sg" data-m="ex" type="button">Ekspor</button><button class="sg" data-m="im" type="button">Impor</button><button class="sg" data-m="bal" type="button">Neraca</button></div>
      </div>
      <div class="map" id="map">
        <div id="wrap"><div id="plot"></div><svg id="ov" aria-hidden="true"></svg><div id="chips"></div></div>
        <div id="mini" class="hide"></div>
        <div class="lgd" id="lgd"></div>
        <span class="cap" id="cap"></span>
      </div>
    </div>
    <div class="pn rankPn">
      <div class="ph"><h2>15 mitra teratas</h2>
        <input class="srch" id="srch" list="dl" placeholder="Cari negara…" aria-label="Cari negara" autocomplete="off"><datalist id="dl"></datalist></div>
      <div class="lg"><span><i style="background:#eb6834"></i>Impor</span><span><i style="background:#2a78d6"></i>Ekspor</span></div>
      <div class="hh"><span style="text-align:right">◀ Impor</span><span style="text-align:center">Negara</span><span>Ekspor ▶</span><span style="text-align:right">Neraca</span></div>
      <div id="rows"></div>
    </div>
  </section>

  <section class="bot">
    <div class="pn prod">
      <div class="ph"><i style="background:#2a78d6"></i><h2 id="expTitle"></h2><span class="sub">US$ miliar, 2025</span></div>
      <div class="hh2"><span></span><span>Produk</span><span>Nilai 2025</span><span class="num">Nilai</span><span class="num">Porsi</span><span class="num">vs 2024</span></div>
      <div class="rowsP" id="expP"></div>
    </div>
    <div class="pn prod">
      <div class="ph"><i style="background:#eb6834"></i><h2 id="impTitle"></h2><span class="sub">US$ miliar, 2025</span></div>
      <div class="hh2"><span></span><span>Produk</span><span>Nilai 2025</span><span class="num">Nilai</span><span class="num">Porsi</span><span class="num">vs 2024</span></div>
      <div class="rowsP" id="impP"></div>
    </div>
  </section>
</div>
<script src="https://cdn.plot.ly/plotly-geo-3.1.0.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
